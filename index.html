<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InvestTrack — Supabase Edition</title>
<style>
:root{--bg:#0b1220;--card:#121b2f;--card2:#0e1626;--line:#243352;--text:#e9eefb;--muted:#9db0cf;--accent:#4f8cff;--green:#31c46f;--red:#ff6b6b;--amber:#f6b93b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
.hidden{display:none}
header{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:14px 20px;background:#101a30;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-weight:800;font-size:19px}.brand span{color:var(--accent)}
.userbox{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center}
button{background:var(--accent);border:0;color:#fff;padding:8px 13px;border-radius:9px;font-weight:600;cursor:pointer;font-size:13px}
button.ghost{background:#1a2743;border:1px solid var(--line);color:var(--text)}
button.danger{background:#7f2b2b}
button.small{padding:5px 9px;font-size:12px}
nav{display:flex;gap:6px;padding:10px 20px;background:#0d1526;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button{background:transparent;color:var(--muted);border:1px solid transparent}
nav button.active{background:#17264a;color:#fff;border-color:var(--line)}
main{padding:20px;max-width:1250px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi h3{margin:0;font-size:12px;color:var(--muted);text-transform:uppercase}.kpi .v{font-size:22px;font-weight:800;margin-top:6px}
.pos{color:var(--green)}.neg{color:var(--red)}
h2{margin:4px 0 14px;font-size:20px}h3{margin:0 0 10px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-size:11px;text-transform:uppercase}
input,select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);padding:9px 10px;border-radius:9px;font-size:13px}
label{display:block;font-size:12px;color:var(--muted);margin:9px 0 4px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.bar{height:9px;background:#22304d;border-radius:99px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--accent)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;background:#1b2a4a;border:1px solid var(--line);font-size:11px;color:var(--muted)}
.tag.warn{background:#42320f;border-color:#6b4f16;color:var(--amber)}
.suggest{position:absolute;background:#15223c;border:1px solid var(--line);border-radius:10px;max-height:210px;overflow:auto;z-index:30;width:100%}
.suggest div{padding:8px 10px;cursor:pointer;font-size:13px}.suggest div:hover{background:#1f305a}
.hidden{display:none}.muted{color:var(--muted);font-size:12px}
.err{color:var(--red);font-size:12px;margin-top:6px}.ok{color:var(--green);font-size:12px;margin-top:6px}
.modal{position:fixed;inset:0;background:#050a14cc;display:none;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto;z-index:50}
.modal.open{display:flex}.modal .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(880px,100%)}
#login{max-width:520px;margin:80px auto;padding:28px;background:var(--card);border:1px solid var(--line);border-radius:16px}
</style>
</head>
<body>
<div id="login">
<h2>InvestTrack</h2>
<p class="muted">Secure shared investment tracker. Sign in with an approved Google account.</p>
<button id="signIn">Continue with Google</button>
<div id="loginMsg"></div>
<p class="muted">Replace <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> at the top of the script with your Supabase values.</p>
</div>
<div id="app" class="hidden">
<header><div class="brand">Invest<span>Track</span> <span class="tag">Supabase</span></div>
<div class="userbox"><span id="who"></span><button id="signOut" class="ghost small">Sign out</button></div></header>
<nav id="nav"></nav>
<main id="view"></main>
</div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>

const SUPABASE_URL='https://oqgtklevnwqnoafkzrcz.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_CsONgxTLUbhZca4uLVEyCw_XRyw53-b';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let USER=null,HOUSEHOLD=null,ROLE='Viewer',state={tab:'dashboard'};
function fmt(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});}
function esc(s){return String(s==null?'':s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');}
function today(){return new Date().toISOString().slice(0,10);}
function msg(id,t,c){const e=document.getElementById(id);if(e){e.className=c;e.textContent=t;}}
function canEdit(){return ROLE==='Owner'||ROLE==='Editor';}
const TABS=[['dashboard','Dashboard'],['portfolio','Equity & MF'],['fixed','Debt & Maturity'],['insurance','Insurance'],['assets','Other Assets'],['market','Market Data'],['import','Bulk Import'],['users','Users']];
function render(){
  if(!USER){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');return;}
  document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');
  document.getElementById('who').innerHTML='<b>'+esc(USER.email)+'</b> · <span class="tag">'+esc(ROLE)+'</span>';
  const nav=document.getElementById('nav');nav.innerHTML='';
  TABS.forEach(function(t){const b=document.createElement('button');b.textContent=t[1];if(state.tab===t[0])b.className='active';b.onclick=function(){state.tab=t[0];render();};nav.appendChild(b);});
  const views={dashboard:viewDashboard,portfolio:viewPortfolio,fixed:viewFixed,insurance:viewInsurance,assets:viewAssets,market:viewMarket,import:viewImport,users:viewUsers};
  views[state.tab](document.getElementById('view'));
}
async function init(){
  const r=await client.auth.getSession();
  if(r.data.session){
    USER=r.data.session.user;
    await loadHousehold();
    if(!HOUSEHOLD){
      await client.auth.signOut({scope:'local'});
      USER=null;
      msg('loginMsg','This Google account is not authorised. Ask the Owner to add your Gmail to the household.','err');
      render();
      return;
    }
  }
  render();
}
async function loadHousehold(){
  const m=await client.from('household_members').select('household_id,role').eq('user_id',USER.id).maybeSingle();
  if(m.data){HOUSEHOLD=m.data.household_id;ROLE=m.data.role;}
}
async function init(){
  const r=await client.auth.getSession();
  if(r.data.session){
    USER=r.data.session.user;
    await loadHousehold();
    if(!HOUSEHOLD){
      await client.auth.signOut({scope:'local'});
      USER=null;
      msg('loginMsg','This Google account is not authorised. Ask the Owner to add your Gmail to the household.','err');
      render();
      return;
    }
  }
  render();
}
async function signOut(){await client.auth.signOut();USER=null;HOUSEHOLD=null;ROLE='Viewer';render();}
function addDays(s,y,m,d){const dt=new Date(s);dt.setFullYear(dt.getFullYear()+Number(y||0));dt.setMonth(dt.getMonth()+Number(m||0));dt.setDate(dt.getDate()+Number(d||0));return dt.toISOString().slice(0,10);}
function tenureYears(y,m,d){return (Number(y||0)*365+Number(m||0)*30+Number(d||0))/365;}
function periodsPerYear(p){return {'Monthly':12,'Quarterly':4,'Half-Yearly':2,'Annually':1}[p]||0;}
function calcInterest(p,r,y,m,d,type,payout){
  const t=tenureYears(y,m,d);const simple=p*r/100;
  if(type==='Recurring Deposit'){const i=r/100/12;const n=Math.max(1,Math.round(t*12));let v=0;for(let k=0;k<n;k++)v+=p*Math.pow(1+i,n-k);return{interest:v-p,maturityValue:v,interestPerYear:(v-p)/Math.max(t,0.000001),interestPerPeriod:0,periods:0};}
  if(type==='Cumulative'){const n=periodsPerYear(payout)||4;const mv=p*Math.pow(1+r/100/n,n*t);return{interest:mv-p,maturityValue:mv,interestPerYear:(mv-p)/Math.max(t,0.000001),interestPerPeriod:(mv-p)/Math.max(n*t,0.000001),periods:Math.round(n*t)};}
  const interest=simple*t;const n=periodsPerYear(payout);return{interest:interest,maturityValue:p+interest,interestPerYear:simple,interestPerPeriod:n?interest/(n*t):0,periods:n?Math.round(n*t):0};
}
let INSTRUMENTS=[],PRICES={};
function instrument(id){return INSTRUMENTS.find(function(i){return i.id===id;});}
function lastPrice(sym){return (PRICES[sym]&&PRICES[sym].price)||0;}
function holdingValue(h){const i=instrument(h.instrument_id);return h.quantity*(lastPrice(i?i.symbol:'')||h.avg_cost);}
async function loadInstruments(){
  const r=await client.from('instruments').select('*').order('name');
  INSTRUMENTS=r.data||[];
  const p=await client.from('market_prices').select('*');
  PRICES={};(p.data||[]).forEach(function(x){PRICES[x.symbol]={price:x.price,source:x.source};});
}
async function viewDashboard(v){
  await loadInstruments();
  const [h,d,i,a]=await Promise.all([
    client.from('holdings').select('*'),
    client.from('debt_investments').select('*').eq('status','Active'),
    client.from('insurance_policies').select('*').eq('status','Active'),
    client.from('other_assets').select('*')
  ]);
  const div={Equity:0,Debt:0,Insurance:0,Others:0};
  (h.data||[]).forEach(function(x){const ins=instrument(x.instrument_id);let c='Others';if(ins){if(ins.type==='Equity'||ins.type==='ETF'||ins.type==='Equity Mutual Fund')c='Equity';if(ins.type==='Debt'||ins.type==='Debt Mutual Fund')c='Debt';}div[c]+=holdingValue(x);});
  (d.data||[]).forEach(function(x){div.Debt+=Number(x.principal);});
  (i.data||[]).forEach(function(x){div.Insurance+=Number(x.annualized_premium);});
  (a.data||[]).forEach(function(x){div.Others+=Number(x.current_value);});
  const total=div.Equity+div.Debt+div.Insurance+div.Others;
  let cards='';
  ['Equity','Debt','Insurance','Others'].forEach(function(k){const pct=total?div[k]/total*100:0;cards+='<div class="card kpi"><h3>'+k+'</h3><div class="v">'+fmt(div[k])+'</div><div class="bar"><i style="width:'+pct+'%"></i></div><p class="muted">'+pct.toFixed(1)+'% of total</p></div>';});
  v.innerHTML='<h2>Summary</h2><div class="grid">'+cards+'</div>';
}
async function viewPortfolio(v){
  await loadInstruments();
  const r=await client.from('holdings').select('*').order('created_at',{ascending:false});
  let rows='';
  (r.data||[]).forEach(function(h){
    const i=instrument(h.instrument_id)||{};
    const invested=h.quantity*h.avg_cost;const val=holdingValue(h);const g=val-invested;
    rows+='<tr><td><b>'+esc(i.name||'')+'</b><br><span class="muted">'+esc(i.symbol||'')+'</span></td><td>'+esc(i.type||'')+'</td><td>'+h.quantity+'</td><td>'+fmt(h.avg_cost)+'</td><td>'+fmt(invested)+'</td><td>'+fmt(val)+'</td><td class="'+(g>=0?'pos':'neg')+'">'+fmt(g)+'</td><td>'+esc(h.platform||'')+'</td><td>'+(canEdit()?'<button class="danger small" onclick="deleteRecord(\'holdings\',\''+h.id+'\')">Delete</button>':'')+'</td></tr>';
  });
  v.innerHTML='<h2>Equity, ETFs & Mutual Funds</h2><div class="actions"><button onclick="holdingForm()">+ Add holding</button></div><div class="card" style="margin-top:14px"><table><tr><th>Instrument</th><th>Type</th><th>Qty</th><th>Avg cost</th><th>Invested</th><th>Current value</th><th>P&L</th><th>Platform</th><th></th></tr>'+(rows||'<tr><td colspan="9" class="muted">No holdings.</td></tr>')+'</table></div>';
}
function holdingForm(){
  openModal('<h2>Add holding</h2><label>Search share, ETF or mutual fund</label><div style="position:relative"><input id="hSearch" placeholder="Type at least 3 letters"><div id="hSug" class="suggest hidden"></div></div><input type="hidden" id="hInstrument"><div id="hSelected" class="muted"></div><div class="row"><div><label>Quantity</label><input id="hQty" type="number" step="any"></div><div><label>Average cost / NAV</label><input id="hCost" type="number" step="any"></div><div><label>Purchase date</label><input id="hDate" type="date" value="'+today()+'"></div><div><label>Platform</label><input id="hPlatform"></div></div><div class="actions"><button onclick="saveHolding()">Save</button><button class="ghost" onclick="closeModal()">Cancel</button></div><div id="hMsg"></div>');
  const inp=document.getElementById('hSearch');const box=document.getElementById('hSug');
  inp.oninput=function(){const q=inp.value.trim().toLowerCase();if(q.length<3){box.classList.add('hidden');return;}
    const res=INSTRUMENTS.filter(function(i){return i.name.toLowerCase().indexOf(q)>=0||i.symbol.toLowerCase().indexOf(q)>=0;}).slice(0,12);
    let html='';res.forEach(function(i){html+='<div onclick="pickInstrument(\''+i.id+'\',\''+esc(i.name)+'\')"><b>'+esc(i.symbol)+'</b> · '+esc(i.name)+' <span class="tag">'+esc(i.type)+'</span></div>';});
    box.innerHTML=html||'<div class="muted">No match</div>';box.classList.remove('hidden');};
}
function pickInstrument(id,name){document.getElementById('hInstrument').value=id;document.getElementById('hSelected').textContent='Selected: '+name;document.getElementById('hSug').classList.add('hidden');}
async function saveHolding(){
  const instrument_id=document.getElementById('hInstrument').value;
  if(!instrument_id){msg('hMsg','Select an instrument from suggestions.','err');return;}
  const r=await client.from('holdings').insert({household_id:HOUSEHOLD,owner_email:USER.email,instrument_id:instrument_id,quantity:+document.getElementById('hQty').value||0,avg_cost:+document.getElementById('hCost').value||0,purchase_date:document.getElementById('hDate').value,platform:document.getElementById('hPlatform').value.trim()});
  if(r.error){msg('hMsg',r.error.message,'err');return;}
  closeModal();render();
}
const INV_TYPES={'Fixed Deposit':['Cumulative','Quarterly','Principal amount'],'Recurring Deposit':['Recurring Deposit','Monthly','Monthly instalment'],'Bond':['Fixed Payout','Annual','Face value / principal'],'Non-Convertible Debenture':['Fixed Payout','Quarterly','Face value / principal'],'Sovereign Gold Bond':['Fixed Payout','Half-Yearly','Issue price / principal'],'Tax-free Bond':['Fixed Payout','Annual','Face value / principal'],'Corporate FD':['Cumulative','Annual','Principal amount'],'Post Office Savings':['Cumulative','Annually','Deposit amount'],'PPF':['Cumulative','Annually','Yearly contribution'],'Small Savings Scheme':['Cumulative','Annually','Deposit / contribution'],'Debt Mutual Fund':['Cumulative','Annually','Investment amount'],'Other Debt Investment':['Cumulative','Quarterly','Principal amount']};
async function viewFixed(v){
  const r=await client.from('debt_investments').select('*').order('maturity_date');
  let rows='';
  (r.data||[]).forEach(function(d){
    const days=Math.round((new Date(d.maturity_date)-new Date())/864e5);
    const warn=days>=0&&days<=15;
    rows+='<tr><td><span class="tag">'+esc(d.investment_type)+'</span></td><td><b>'+esc(d.name)+'</b>'+(warn?' <span class="tag warn">Matures soon</span>':'')+'</td><td>'+fmt(d.principal)+'</td><td>'+d.rate+'%</td><td>'+d.tenure_years+'y '+d.tenure_months+'m '+d.tenure_days+'d</td><td>'+esc(d.interest_type)+'</td><td>'+esc(d.payout)+'</td><td>'+fmt(d.interest_per_year)+'</td><td>'+((d.interest_type==='Fixed Payout'&&d.payout!=='Maturity')?fmt(d.interest_per_period):'-')+'</td><td>'+fmt(d.interest_amount)+'</td><td>'+esc(d.maturity_date)+'</td><td>'+fmt(d.maturity_value)+'</td><td>'+(canEdit()?'<button class="danger small" onclick="deleteRecord(\'debt_investments\',\''+d.id+'\')">Delete</button>':'')+'</td></tr>';
  });
  v.innerHTML='<h2>Debt Investments, Interest & Maturity</h2><div class="actions"><button onclick="debtForm()">+ Add debt investment</button></div><div class="card" style="margin-top:14px"><table><tr><th>Type</th><th>Investment</th><th>Principal</th><th>Rate</th><th>Tenor</th><th>Interest type</th><th>Payout</th><th>Interest / year</th><th>Interest / period</th><th>Total interest</th><th>Maturity date</th><th>Maturity value</th><th></th></tr>'+(rows||'<tr><td colspan="13" class="muted">No debt investments.</td></tr>')+'</table></div>';
}
let invOptions='';
Object.keys(INV_TYPES).forEach(function(k){invOptions+='<option>'+k+'</option>';});
function debtForm(){
  openModal('<h2>Add debt investment</h2><label>Type of investment</label><select id="dType" onchange="debtTypeChanged()">'+invOptions+'</select><label>Investment name</label><input id="dName"><div class="row"><div><label id="dPrincipalLabel">Principal amount (₹)</label><input id="dPrincipal" type="number" step="any"></div><div><label>Interest rate (% p.a.)</label><input id="dRate" type="number" step="any"></div><div><label>Start date</label><input id="dStart" type="date" value="'+today()+'"></div></div><label>Tenor</label><div class="row"><div><label>Years</label><input id="dYears" type="number" min="0" value="1"></div><div><label>Months</label><input id="dMonths" type="number" min="0" max="11" value="0"></div><div><label>Days</label><input id="dDays" type="number" min="0" value="0"></div></div><div class="row"><div><label>Interest type</label><select id="dInterestType"><option>Cumulative</option><option>Fixed Payout</option><option>Recurring Deposit</option></select></div><div><label>Payout / compounding</label><select id="dPayout"><option>Monthly</option><option>Quarterly</option><option>Half-Yearly</option><option>Annually</option><option>Maturity</option></select></div></div><label>Bank IFSC</label><input id="dIfsc" placeholder="HDFC0000317"><div id="ifscInfo" class="muted"></div><div class="actions"><button onclick="saveDebt()">Save & calculate</button><button class="ghost" onclick="closeModal()">Cancel</button></div><div id="dMsg"></div>');
  document.getElementById('dIfsc').addEventListener('blur',lookupIfsc);
}
function debtTypeChanged(){
  const t=document.getElementById('dType').value;const c=INV_TYPES[t];
  document.getElementById('dPrincipalLabel').textContent=c[2]+' (₹)';
  document.getElementById('dInterestType').value=c[0];
  document.getElementById('dPayout').value=c[1];
}
async function lookupIfsc(){
  const code=document.getElementById('dIfsc').value.trim().toUpperCase();
  const out=document.getElementById('ifscInfo');
  if(!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(code)){out.textContent='';return;}
  out.textContent='Looking up IFSC...';
  try{const r=await fetch('https://ifsc.razorpay.com/'+code);const d=await r.json();out.innerHTML='<span class="ok">'+esc(d.BANK)+' — '+esc(d.BRANCH)+', '+esc(d.CITY||'')+', '+esc(d.STATE||'')+'</span>';}catch(e){out.innerHTML='<span class="err">IFSC lookup unavailable.</span>';}
}
async function saveDebt(){
  const type=document.getElementById('dType').value;const c=INV_TYPES[type];
  const p=+document.getElementById('dPrincipal').value||0;const r=+document.getElementById('dRate').value||0;
  const start=document.getElementById('dStart').value;const y=+document.getElementById('dYears').value||0;
  const m=+document.getElementById('dMonths').value||0;const d=+document.getElementById('dDays').value||0;
  const interestType=document.getElementById('dInterestType').value;const payout=document.getElementById('dPayout').value;
  if(!p||!r||!start){msg('dMsg','Principal, rate and start date are required.','err');return;}
  const calc=calcInterest(p,r,y,m,d,interestType,payout);
  const rec={household_id:HOUSEHOLD,owner_email:USER.email,investment_type:type,name:document.getElementById('dName').value.trim(),principal:p,rate:r,start_date:start,tenure_years:y,tenure_months:m,tenure_days:d,interest_type:interestType,payout:payout,interest_per_year:calc.interestPerYear,interest_per_period:calc.interestPerPeriod,interest_amount:calc.interest,maturity_date:addDays(start,y,m,d),maturity_value:calc.maturityValue,ifsc:document.getElementById('dIfsc').value.trim().toUpperCase(),status:'Active'};
  if(!rec.name){msg('dMsg','Investment name is required.','err');return;}
  const res=await client.from('debt_investments').insert(rec);
  if(res.error){msg('dMsg',res.error.message,'err');return;}
  closeModal();render();
}
async function viewInsurance(v){
  const r=await client.from('insurance_policies').select('*').order('created_at',{ascending:false});
  let rows='';
  (r.data||[]).forEach(function(i){rows+='<tr><td><b>'+esc(i.insurer)+'</b></td><td>'+esc(i.policy_name||'')+'</td><td>'+esc(i.policy_type)+'</td><td>'+esc(i.policy_number)+'</td><td>'+fmt(i.coverage_amount)+'</td><td>'+fmt(i.annualized_premium)+'</td><td>'+esc(i.maturity_date||'-')+'</td><td>'+esc(i.nominee||'')+'</td><td>'+(canEdit()?'<button class="danger small" onclick="deleteRecord(\'insurance_policies\',\''+i.id+'\')">Delete</button>':'')+'</td></tr>';});
  v.innerHTML='<h2>Insurance Policies</h2><div class="card"><div class="actions"><button onclick="insuranceForm()">+ Add insurance policy</button></div></div><div class="card" style="margin-top:14px"><table><tr><th>Insurer</th><th>Policy</th><th>Type</th><th>Number</th><th>Coverage</th><th>Annualised premium</th><th>Maturity</th><th>Nominee</th><th></th></tr>'+(rows||'<tr><td colspan="9" class="muted">No policies.</td></tr>')+'</table></div>';

function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}
      else cur+=c;
    }else{
      if(c==='"')q=true;
      else if(c===','){row.push(cur);cur='';}
      else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else if(c==='\r'){}
      else cur+=c;
    }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  if(!rows.length)return[];
  const head=rows[0].map(function(h){return h.trim();});
  return rows.slice(1).filter(function(r){return r.some(function(x){return x.trim()!=='';});}).map(function(r){
    const o={};head.forEach(function(h,i){o[h]=r[i]!==undefined?r[i].trim():'';});return o;
  });
}
function pick(row){
  const keys=Array.prototype.slice.call(arguments,1);
  for(let x=0;x<keys.length;x++){
    const target=keys[x].toLowerCase().replace(/[^a-z]/g,'');
    const hit=Object.keys(row).find(function(k){return k.toLowerCase().replace(/[^a-z]/g,'')===target;});
    if(hit&&row[hit]!==undefined&&row[hit]!=='')return row[hit];
  }
  return '';
}

async function importScripMaster(){
  const f=document.getElementById('scripFile').files[0];
  if(!f){msg('scripFileMsg','Choose the NSE equity_L CSV file.','err');return;}
  const text=await f.text();
  try{
    const rows=parseCSV(text);
    if(!rows.length)throw new Error('No data rows found');
    let added=0,updated=0,skipped=0;
    for(const r of rows){
      const symbol=String(pick(r,'SYMBOL','Symbol','TckrSymb','TRADING SYMBOL')||'').trim().toUpperCase();
      if(!symbol){skipped++;continue;}
      const name=String(pick(r,'NAME OF COMPANY','COMPANY NAME','COMPANY','SECURITY NAME','SECURITY','NAME')||'').trim();
      const isin=String(pick(r,'ISIN','ISIN NUMBER','ISIN CODE')||'').trim().toUpperCase();
      const existing=INSTRUMENTS.find(function(i){return i.symbol===symbol;});
      if(existing){
        const upd={};
        if(name)upd.name=name;
        if(isin)upd.isin=isin;
        if(Object.keys(upd).length){await client.from('instruments').update(upd).eq('id',existing.id);updated++;}
      }else{
        await client.from('instruments').insert({household_id:HOUSEHOLD,type:'Equity',name:name||symbol,symbol:symbol,exchange:'NSE',isin:isin,issuer:name||symbol,category:'NSE Scrip Master'});
        added++;
      }
    }
    await loadInstruments();
    msg('scripFileMsg','Processed '+rows.length+' rows: '+added+' new scrips added, '+updated+' existing scrips updated, '+skipped+' rows skipped.','ok');
    render();
  }catch(err){msg('scripFileMsg','Could not process file: '+err.message,'err');}
}

  try{

      if(!symbol){skipped++;continue;}
      const series=String(pick(r,'SERIES','Series','SctySrs')||'').trim().toUpperCase();
      if(series&&series!=='EQ'&&series!=='BE'){skipped++;continue;}
      const name=String(pick(r,'NAME OF COMPANY','COMPANY NAME','COMPANY','SECURITY NAME','SECURITY','NAME')||'').trim();
      const isin=String(pick(r,'ISIN','ISIN NUMBER','ISIN CODE')||'').trim().toUpperCase();
      const existing=INSTRUMENTS.find(function(i){return i.symbol===symbol;});
      if(existing){
        const upd={};
        if(name)upd.name=name;
        if(isin)upd.isin=isin;
        if(Object.keys(upd).length){await client.from('instruments').update(upd).eq('id',existing.id);}
      }else{
        await client.from('instruments').insert({household_id:HOUSEHOLD,type:'Equity',name:name||symbol,symbol:symbol,exchange:'NSE',isin:isin,issuer:name||symbol,category:'NSE Import'});
      }
      const close=parseFloat(String(pick(r,'PREVCLOSE','PREVIOUS CLOSE','CLOSE','CLOSE PRICE','LAST','LAST PRICE')).replace(/,/g,''));

        else{await client.from('market_prices').insert({household_id:HOUSEHOLD,symbol:symbol,price:close,source:'NSE bhavcopy'});}
        prices++;
      }
      updated++;
    }
    await loadInstruments();
    msg('bhavMsg','Processed '+rows.length+' rows: '+updated+' scrips checked, '+prices+' previous-close prices updated, '+skipped+' rows skipped.','ok');

  }catch(err){msg('bhavMsg','Could not process file: '+err.message,'err');}
}

document.getElementById('modal').addEventListener('click',function(e){if(e.target.id==='modal')closeModal();});

document.getElementById('signOut').addEventListener('click',signOut);
