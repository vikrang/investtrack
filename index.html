ase date", "type": "date", "options": null, "required": false}, {"key": "purchase_value", "label": "Purchase value", "type": "number", "options": null, "required": false}, {"key": "current_value", "label": "Current value", "type": "number", "options": null, "required": true}, {"key": "location", "label": "Location", "type": "text", "options": null, "required": false}, {"key": "detail", "label": "Extra detail", "type": "text", "options": null, "required": false}]}};
const $=id=>document.getElementById(id),locale=navigator.language||'en-IN';
let client,USER=null,HOUSEHOLD=null,ROLE='Viewer',currentTab='dashboard',INSTRUMENTS=[],PRICES={},recordCache=[],marketLoaded=false,busy=false,renderVersion=0;
const canEdit=()=>['Owner','Editor'].includes(ROLE);

async function checked(query){const r=await query;if(r.error)throw new Error(r.error.message);return r.data;}
async function fetchAll(table){let rows=[],offset=0;for(;;){const data=await checked(client.from(table).select('*').eq('household_id',HOUSEHOLD).order('id').range(offset,offset+499));if(!data?.length)break;rows.push(...data);offset+=data.length;}return rows;}
async function loadMarketData(force=false){if(marketLoaded&&!force)return;const [ins,prices]=await Promise.all([fetchAll('instruments'),fetchAll('market_prices')]);INSTRUMENTS=ins.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));PRICES=Object.fromEntries(prices.map(p=>[p.symbol,p]));marketLoaded=true;}
async function signInWithGoogle(){const b=$('signIn');b.disabled=true;status('loginMsg','Connecting to Google…');try{if(!client)throw new Error('Supabase library unavailable.');const r=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname,skipBrowserRedirect:true}});if(r.error)throw r.error;if(!r.data?.url)throw new Error('No sign-in URL returned.');location.assign(r.data.url);}catch(e){status('loginMsg',e.message,true);b.disabled=false;}}
async function init(){try{if(!window.supabase)throw new Error('Supabase library did not load.');client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const s=await client.auth.getSession();if(s.error)throw s.error;if(!s.data.session)return;const u=await client.auth.getUser();if(u.error)throw u.error;USER=u.data.user;const m=await checked(client.from('household_members').select('household_id,role').eq('user_id',USER.id));if(!m?.length){await client.auth.signOut({scope:'local'});throw new Error('This account is not authorised. Ask the Owner to add your user ID.');}if(m.length!==1)throw new Error('Exactly one household membership per user is required.');HOUSEHOLD=m[0].household_id;ROLE=m[0].role;$('who').textContent=USER.email+' · '+ROLE;$('login').classList.add('hidden');$('app').classList.remove('hidden');await render();}catch(e){USER=null;HOUSEHOLD=null;$('app').classList.add('hidden');$('login').classList.remove('hidden');status('loginMsg',e.message,true);}}
async function signOut(){if(busy)return;try{const r=await client.auth.signOut({scope:'local'});if(r.error)throw r.error;USER=null;HOUSEHOLD=null;ROLE='Viewer';marketLoaded=false;INSTRUMENTS=[];PRICES={};$('app').classList.add('hidden');$('login').classList.remove('hidden');$('signIn').disabled=false;status('loginMsg','Signed out.');}catch(e){status('global',e.message,true);}}
const TABS=[['dashboard','Dashboard'],['equity','Equity & MF'],['debt','Debt & Maturity'],['insurance','Insurance'],['assets','Other Assets'],['market','Market Data'],['import','Bulk Import'],['users','Users']];
async function render(){if(!HOUSEHOLD)return;const version=++renderVersion,tab=currentTab;$('nav').replaceChildren();TABS.forEach(([key,label])=>{const b=document.createElement('button');b.textContent=label;b.className=tab===key?'active':'';b.disabled=busy;b.onclick=()=>{if(!busy){currentTab=key;render();}};$('nav').appendChild(b);});$('view').innerHTML='<p>Loading…</p>';try{if(['dashboard','equity','market'].includes(tab))await loadMarketData();if(version!==renderVersion)return;if(tab==='dashboard')await dashboard(version);else if(SPECS[tab])await showRecords(tab,version);else if(tab==='market')marketScreen();else if(tab==='import')importScreen();else await usersScreen(version);}catch(e){if(version!==renderVersion)return;$('view').innerHTML='<div class="card"><h2>Unable to load '+esc(tab)+'</h2><p class="error">'+esc(e.message)+'</p><button onclick="render()">Retry</button></div>';}}
const instrument=id=>INSTRUMENTS.find(i=>i.id===id);
function priceInfo(record){const i=instrument(record.instrument_id),p=PRICES[i?.symbol],value=Number(p?.price);return p&&Number.isFinite(value)&&value>0?{...p,value}:null;}
function holdingValue(r){return Number(r.quantity)*(priceInfo(r)?.value??Number(r.avg_cost));}
async function dashboard(version){const [h,d,i,a]=await Promise.all(['holdings','debt_investments','insurance_policies','other_assets'].map(t=>fetchAll(t)));if(version!==renderVersion)return;const totals={'Equity / fund valuation':h.reduce((s,r)=>s+holdingValue(r),0),'Active debt principal':d.filter(r=>r.status==='Active').reduce((s,r)=>s+Number(r.principal),0),'Annualised insurance premiums':i.filter(r=>r.status==='Active').reduce((s,r)=>s+Number(r.annualized_premium),0),'Other asset valuation':a.reduce((s,r)=>s+Number(r.current_value),0)};$('view').innerHTML='<h2>Household overview</h2><div class="grid">'+Object.entries(totals).map(([label,v])=>'<div class="card"><h3>'+esc(label)+'</h3><div class="value">'+money(v)+'</div></div>').join('')+'</div><div class="card">'+INSTRUMENTS.length+' scrips and '+Object.keys(PRICES).length+' prices loaded.<p class="muted">Insurance premiums are not asset values. Do not sum these cards as net worth. Debt projections are estimates; RD principal is the monthly instalment.</p><small>Build '+BUILD+'</small></div>';}
async function showRecords(kind,version){const spec=SPECS[kind],records=await fetchAll(spec.table);if(version!==renderVersion)return;recordCache=records;let cols=spec.fields.filter(f=>f.type!=='scrip').map(f=>[f.key,f.label]);if(kind==='equity')cols=[['scrip','Scrip'],['market_price','Market price / NAV'],...cols,['valuation','Current value'],['gain','Gain / loss']];if(kind==='debt')cols.push(['interest_amount','Projected interest'],['maturity_date','Maturity date'],['maturity_value','Projected total receipts']);const rendered=records.map((r,index)=>'<tr>'+cols.map(([key])=>{if(key==='market_price'){const p=priceInfo(r);return '<td>'+(p?'<span class="price">'+money(p.value)+'</span><br><small>'+esc(p.source||'Saved price')+'</small>'+(p.nse_report_date?'<br><small>Report: '+esc(dateText(p.nse_report_date))+'</small>':'')+(p.fetched_at?'<br><small>Updated: '+esc(new Date(p.fetched_at).toLocaleString(locale))+'</small>':''):'<span class="muted">Not available</span><br><small>Valuation uses average cost</small>')+'</td>';}let value=r[key];if(key==='scrip'){const i=instrument(r.instrument_id);value=i?i.symbol+' — '+i.name:'Unknown scrip';}else if(key==='valuation')value=money(holdingValue(r));else if(key==='gain')value=money(holdingValue(r)-r.quantity*r.avg_cost);else if(/date$/.test(key))value=dateText(value);else if(['avg_cost','principal','premium','coverage_amount','purchase_value','current_value','interest_amount','maturity_value'].includes(key))value=money(value);return '<td>'+esc(value??'')+'</td>';}).join('')+'<td>'+(canEdit()?'<div class="actions"><button onclick="recordForm(\''+kind+'\','+index+')">Edit</button><button class="danger" onclick="deleteRecord(\''+kind+'\','+index+')">Delete</button></div>':'')+'</td></tr>').join('');$('view').innerHTML='<h2>'+spec.title+'</h2>'+(kind==='equity'?'<p class="muted">Market price / NAV is the last saved value, not a live quote. Mutual funds need their own saved NAV. Missing prices are not shown as market quotes; valuation falls back to average cost.</p><div class="actions"><button class="ghost" onclick="refreshMarket(this)">Reload saved prices</button></div>':'')+(canEdit()?'<div class="actions"><button onclick="recordForm(\''+kind+'\')">+ Add record</button></div>':'')+'<div class="card"><table><tr>'+cols.map(c=>'<th>'+esc(c[1])+'</th>').join('')+'<th>Actions</th></tr>'+rendered+'</table>'+(!records.length?'<p>No records.</p>':'')+'</div>';}
function closeModal(){$('modal').classList.add('hidden');}
function recordForm(kind,index=null){try{requireEditor();const spec=SPECS[kind],old=index===null?null:recordCache[index];if(index!==null&&!old)throw new Error('Record not found.');$('modalBox').innerHTML='<h2>'+(old?'Edit ':'Add ')+spec.title+'</h2><form id="recordForm"><div class="row">'+spec.fields.map(f=>{let c;if(f.type==='scrip')c='<input id="scripSearch" autocomplete="off" placeholder="Type 3 letters: name, symbol or ISIN"><input id="f_instrument_id" type="hidden"><div id="suggestions" class="suggest hidden"></div><small id="selection"></small>';else if(f.type==='select')c='<select id="f_'+f.key+'">'+f.options.map(o=>'<option>'+esc(o)+'</option>').join('')+'</select>';else c='<input id="f_'+f.key+'" type="'+f.type+'"'+(f.type==='number'?' step="any" min="0"':'')+(f.required?' required':'')+'>';return '<div><label>'+esc(f.label)+(f.required?' *':'')+'</label>'+c+'</div>';}).join('')+'</div><div class="actions"><button type="submit">Save changes</button><button type="button" class="ghost" onclick="closeModal()">Cancel</button></div><div id="formMsg" class="notice" role="status"></div></form>';spec.fields.forEach(f=>{$('f_'+f.key).value=old?.[f.key]??(f.type==='select'?f.options[0]:f.type==='date'&&f.key!=='maturity_date'?today():'');});if(kind==='equity'){const selected=instrument(old?.instrument_id);if(selected){$('scripSearch').value=selected.symbol;$('selection').textContent='Selected: '+selected.name;}$('scripSearch').oninput=()=>{const q=$('scripSearch').value.trim().toLowerCase(),box=$('suggestions');$('f_instrument_id').value='';$('selection').textContent='';box.replaceChildren();box.classList.toggle('hidden',q.length<3);if(q.length<3)return;const matches=INSTRUMENTS.filter(i=>[i.name,i.symbol,i.isin].some(v=>String(v||'').toLowerCase().includes(q))).slice(0,30);if(!matches.length)box.textContent='No match among '+INSTRUMENTS.length+' loaded scrips. Check the CSV import result.';matches.forEach(i=>{const b=document.createElement('button');b.type='button';b.textContent=i.symbol+' — '+i.name+' · '+(i.isin||'');b.onclick=()=>{$('f_instrument_id').value=i.id;$('scripSearch').value=i.symbol;$('selection').textContent='Selected: '+i.name;box.classList.add('hidden');};box.appendChild(b);});};}$('recordForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const values={};spec.fields.forEach(f=>values[f.key]=$('f_'+f.key).value);await saveInvestment(kind,values,old?.id);closeModal();await render();}catch(err){status('formMsg',err.message,true);}finally{b.disabled=false;}};$('modal').classList.remove('hidden');}catch(e){status('global',e.message,true);}}
function numberValue(v){if(v===''||v==null)return 0;if(typeof v==='number'&&Number.isFinite(v))return v;const parts=new Intl.NumberFormat(locale).formatToParts(12345.6),group=parts.find(p=>p.type==='group')?.value,decimal=parts.find(p=>p.type==='decimal')?.value||'.';let s=String(v).replace(/[₹\s]/g,'');if(group)s=s.split(group).join('');if(decimal!=='.')s=s.replace(decimal,'.');const n=Number(s);if(!Number.isFinite(n))throw new Error('Invalid number: '+v);return n;}
function isoDate(v){if(v instanceof Date&&!isNaN(v))return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;const s=String(v||'').trim();if(!s)return null;let y,m,d;if(/^\d{4}-\d{2}-\d{2}$/.test(s))[y,m,d]=s.split('-').map(Number);else{const a=s.split(/[\/.-]/),order=new Intl.DateTimeFormat(locale).formatToParts(new Date(2020,10,22)).filter(p=>['year','month','day'].includes(p.type)).map(p=>p.type);if(a.length!==3)throw new Error('Use Excel date cells or YYYY-MM-DD.');const o={};order.forEach((k,i)=>o[k]=Number(a[i]));y=o.year;m=o.month;d=o.day;}const dt=new Date(y,m-1,d);if(y<1900||dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d)throw new Error('Invalid date: '+s);return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function debtProjection(r){const t=r.tenure_years+r.tenure_months/12+r.tenure_days/365;if(t<=0)throw new Error('Enter positive debt tenure.');const p=r.principal,rate=r.rate/100;let contributed=p,total;if(r.interest_type==='Recurring Deposit'){const n=Math.max(1,Math.round(t*12));contributed=p*n;total=0;for(let j=1;j<=n;j++)total+=p*Math.pow(1+rate/12,j);}else if(r.interest_type==='Cumulative'){const f={Monthly:12,Quarterly:4,'Half-Yearly':2,Annually:1,Maturity:1}[r.payout];total=p*Math.pow(1+rate/f,f*t);}else total=p+p*rate*t;const dt=new Date(r.start_date+'T12:00:00');dt.setFullYear(dt.getFullYear()+r.tenure_years);dt.setMonth(dt.getMonth()+r.tenure_months);dt.setDate(dt.getDate()+r.tenure_days);const n={Monthly:12,Quarterly:4,'Half-Yearly':2,Annually:1}[r.payout]||0;return {interest_amount:total-contributed,interest_per_year:(total-contributed)/t,interest_per_period:n?(r.interest_type==='Fixed Payout'?p*rate/n:(total-contributed)/(n*t)):0,maturity_date:isoDate(dt),maturity_value:total};}
async function saveInvestment(kind,input,id=null){requireEditor();const spec=SPECS[kind],r={};for(const f of spec.fields){let v=input[f.key]??'';if(f.required&&(v===''||v==null))throw new Error(f.label+' is required.');if(f.type==='number'){v=numberValue(v);if(v<0)throw new Error(f.label+' cannot be negative.');}else if(f.type==='date')v=isoDate(v);else v=String(v).trim();if(f.options&&!f.options.includes(v))throw new Error('Choose valid '+f.label);r[f.key]=v;}if(kind==='equity'){if(!instrument(r.instrument_id))throw new Error('Select a scrip from search results.');if(r.quantity<=0)throw new Error('Quantity must be positive.');}if(kind==='debt'){if(r.principal<=0)throw new Error('Principal must be positive.');['tenure_years','tenure_months','tenure_days'].forEach(k=>{if(!Number.isInteger(r[k]))throw new Error('Tenure must use whole numbers.');});Object.assign(r,debtProjection(r));if(!id)r.status='Active';}if(kind==='insurance'){r.annualized_premium=r.premium*({Monthly:12,Quarterly:4,'Half-Yearly':2,Yearly:1,Single:1}[r.premium_frequency]);if(!id)r.status='Active';}if(id){const data=await checked(client.from(spec.table).update(r).eq('id',id).eq('household_id',HOUSEHOLD).select('id'));if(!data?.length)throw new Error('No record updated. Check UPDATE security policy.');}else{r.household_id=HOUSEHOLD;r.owner_email=USER.email;await checked(client.from(spec.table).insert(r));}}
async function deleteRecord(kind,index){try{requireEditor();const r=recordCache[index];if(!r)throw new Error('Record not found.');if(!confirm('Delete this record?'))return;const changed=await checked(client.from(SPECS[kind].table).delete().eq('id',r.id).eq('household_id',HOUSEHOLD).select('id'));if(!changed?.length)throw new Error('Deletion blocked by database policy.');await render();}catch(e){status('global',e.message,true);}}
function marketScreen(){$('view').innerHTML=`<h2>Market Data</h2><p>${INSTRUMENTS.length} scrips and ${Object.keys(PRICES).length} prices loaded. Build ${BUILD}.</p><div class="actions"><button class="ghost" onclick="refreshMarket(this)">Reload saved scrips & prices</button></div><div class="card"><h3>Fetch latest available NSE data</h3><label>What to update</label><select id="fetchChoice"><option value="prices">End-of-day prices</option><option value="master">Scrip master</option><option value="both">Both</option></select><label>Price field</label><select id="fetchPriceField"><option value="close">File closing price</option><option value="previous">Previous close</option></select><div class="actions"><button onclick="fetchLatestNSE(this)">Fetch latest NSE data</button></div><p class="muted">Requires the separately deployed nse-market-update Edge Function.</p><div id="fetchMsg" class="notice" role="status"></div></div><div class="card"><h3>Upload NSE equity master</h3><input id="masterFile" type="file" accept=".csv"><div class="actions"><button onclick="importCSV('master',this)">Import EQUITY_L.csv</button></div><div id="masterMsg" class="notice" role="status"></div></div><div class="card"><h3>Upload bhavcopy / prices</h3><p>Use extracted CSV, not ZIP. No filename-date validation.</p><label>Price field</label><select id="csvPriceField"><option value="close">CLOSE / ClsPric</option><option value="previous">PREVCLOSE / PrvsClsgPric</option></select><input id="priceFile" type="file" accept=".csv"><div class="actions"><button onclick="importCSV('prices',this)">Import prices in batches</button></div><div id="priceMsg" class="notice" role="status"></div></div>`;}
async function refreshMarket(b){b.disabled=true;try{await loadMarketData(true);status('global',INSTRUMENTS.length+' scrips and '+Object.keys(PRICES).length+' prices reloaded.');await render();}catch(e){status('global',e.message,true);}finally{b.disabled=false;}}
async function fetchLatestNSE(b){try{requireEditor();if(busy)throw new Error('Another operation is running.');setBusy(true);b.disabled=true;status('fetchMsg','Requesting latest published NSE report…');const r=await client.functions.invoke('nse-market-update',{body:{household_id:HOUSEHOLD,choice:$('fetchChoice').value,price_field:$('fetchPriceField').value}});if(r.error)throw r.error;if(r.data?.success!==true)throw new Error(r.data?.error||'Backend did not confirm update.');await loadMarketData(true);status('fetchMsg','Backend confirmed update.\nReport date: '+(r.data.report_date||'not supplied')+'\nScrips updated: '+(r.data.scrips_updated??'not supplied')+'\nPrices updated: '+(r.data.prices_updated??'not supplied'));}catch(e){status('fetchMsg','NSE fetch failed: '+e.message+'\nCheck deployment/logs for nse-market-update. CSV upload remains available.',true);}finally{setBusy(false);b.disabled=false;}}
const normalise=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
function pick(row,...names){for(const name of names){const key=Object.keys(row).find(k=>normalise(k)===normalise(name));if(key!==undefined&&row[key]!==''&&row[key]!=null)return row[key];}return '';}
function parseCSV(text){text=text.replace(/^\uFEFF/,'');if(/^\s*</.test(text))throw new Error('This appears to be HTML, not CSV.');let delimiter=',',first=text.split(/\r?\n/).find(x=>x.trim())||'';if(/^sep=./i.test(first)){delimiter=first.slice(4,5);text=text.slice(text.indexOf('\n')+1);}else delimiter=[',',';','\t'].sort((a,b)=>first.split(b).length-first.split(a).length)[0];const rows=[];let row=[],value='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){value+='"';i++;}else quoted=!quoted;}else if(c===delimiter&&!quoted){row.push(value.trim());value='';}else if(/[\r\n]/.test(c)&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(value.trim());if(row.some(Boolean))rows.push(row);row=[];value='';}else value+=c;}if(quoted)throw new Error('Unclosed CSV quote.');row.push(value.trim());if(row.some(Boolean))rows.push(row);if(rows.length<2)throw new Error('No CSV rows.');const headers=rows.shift();return rows.map((r,i)=>{if(r.length>headers.length)throw new Error('Too many columns in CSV row '+(i+2));return Object.fromEntries(headers.map((h,j)=>[h,r[j]||'']));});}
async function writeBatches(table,rows,conflict,messageId,counts){let saved=0;for(let offset=0;offset<rows.length;offset+=150){const batch=rows.slice(offset,offset+150),changed=await checked(client.from(table).upsert(batch,{onConflict:conflict}).select('id'));if(changed?.length!==batch.length)throw new Error('Some '+table+' writes were blocked.');saved+=changed.length;counts[table]=saved;status(messageId,'Saving '+table+': '+saved+'/'+rows.length+' rows…');}return saved;}
async function importCSV(mode,b){const messageId=mode==='master'?'masterMsg':'priceMsg',counts={instruments:0,market_prices:0};let wrote=false;try{requireEditor();if(busy)throw new Error('Another operation is running.');const f=$(mode==='master'?'masterFile':'priceFile').files[0];if(!f||!/\.csv$/i.test(f.name))throw new Error('Choose extracted .csv file.');setBusy(true);b.disabled=true;status(messageId,'Loading saved IDs and reading CSV…');await loadMarketData(true);const rows=parseCSV(await f.text());if(!Object.keys(rows[0]).some(k=>['symbol','tckrsymb','tradingsymbol'].includes(normalise(k))))throw new Error('SYMBOL / TckrSymb header not found.');const priceField=mode==='prices'?$('csvPriceField').value:null,existing=new Map(),scrips=new Map(),prices=new Map(),seen=new Map(),errors=[];for(const i of INSTRUMENTS){if(existing.has(i.symbol))throw new Error('Duplicate saved symbol '+i.symbol+'. Resolve duplicates first.');existing.set(i.symbol,i);}let skipped=0,invalid=0;for(let index=0;index<rows.length;index++){const r=rows[index],symbol=String(pick(r,'SYMBOL','TckrSymb','TRADING SYMBOL')).trim().toUpperCase(),series=String(pick(r,'SERIES','SctySrs')).trim().toUpperCase();if(!symbol||(mode==='prices'&&series&&!['EQ','BE'].includes(series))){skipped++;continue;}if(mode==='prices'&&seen.has(symbol)&&seen.get(symbol)!==series)throw new Error('Multiple series for '+symbol+'. Select one required equity series.');seen.set(symbol,series);let price;if(mode==='prices'){const raw=priceField==='previous'?pick(r,'PREVCLOSE','PREV CLOSE','PREVIOUS CLOSE','PrvsClsgPric'):pick(r,'CLOSE','CLOSE PRICE','ClsPric');price=Number(String(raw).replace(/,/g,''));if(raw===''||!Number.isFinite(price)||price<=0){invalid++;if(errors.length<5)errors.push('Row '+(index+2)+': invalid or missing selected price.');continue;}}const name=String(pick(r,'NAME OF COMPANY','COMPANY NAME','SECURITY NAME','FinInstrmNm','NAME')).trim(),isin=String(pick(r,'ISIN','ISIN NUMBER','ISIN CODE')).trim().toUpperCase(),old=scrips.get(symbol)||existing.get(symbol);scrips.set(symbol,{id:old?.id||crypto.randomUUID(),household_id:HOUSEHOLD,symbol,name:name||old?.name||symbol,isin:isin||old?.isin||'',type:old?.type||'Equity',exchange:old?.exchange||'NSE',issuer:old?.issuer||name||symbol,category:old?.category||'NSE CSV import'});if(mode==='prices')prices.set(symbol,{household_id:HOUSEHOLD,symbol,price,source:'NSE '+priceField+' · '+f.name,fetched_at:new Date().toISOString()});}if(!scrips.size)throw new Error('No valid rows to save. Check selected price field.');wrote=true;await writeBatches('instruments',[...scrips.values()],'id',messageId,counts);if(prices.size)await writeBatches('market_prices',[...prices.values()],'household_id,symbol',messageId,counts);marketLoaded=false;await loadMarketData();status(messageId,`Import complete.\n${counts.instruments} scrips saved; ${counts.market_prices} prices saved.\n${skipped} rows skipped; ${invalid} invalid rows.\n${errors.join('\n')}\n${INSTRUMENTS.length} scrips available for search.`,invalid>0);}catch(e){if(wrote)marketLoaded=false;status(messageId,'Import stopped: '+e.message+`\nConfirmed batch writes: ${counts.instruments} scrips; ${counts.market_prices} prices. Earlier batches may already have been saved.`,true);}finally{setBusy(false);b.disabled=false;}}
async function saveScrip(data){requireEditor();const old=INSTRUMENTS.find(i=>i.symbol===data.symbol);if(old){const update={};['name','isin','type'].forEach(k=>{if(data[k])update[k]=data[k];});if(!Object.keys(update).length)return old;const rows=await checked(client.from('instruments').update(update).eq('id',old.id).eq('household_id',HOUSEHOLD).select('*'));if(!rows?.length)throw new Error('Scrip update blocked by database policy.');Object.assign(old,rows[0]);return old;}const r=await checked(client.from('instruments').insert({household_id:HOUSEHOLD,type:data.type||'Equity',symbol:data.symbol,name:data.name||data.symbol,isin:data.isin||'',exchange:'NSE',issuer:data.name||data.symbol,category:'Workbook import'}).select().single());INSTRUMENTS.push(r);return r;}
let excelPromise;
async function excelLibrary(){if(window.ExcelJS)return window.ExcelJS;if(!excelPromise)excelPromise=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';s.onload=()=>resolve(window.ExcelJS);s.onerror=()=>{excelPromise=null;reject(new Error('Excel library could not load.'));};document.head.appendChild(s);});return excelPromise;}
function importScreen(){$('view').innerHTML=`<h2>Bulk Import</h2><div class="card"><h3>Excel template</h3><p>Separate category tabs, dropdowns and blank input rows.</p><p class="muted">Browser locale: ${esc(locale)}. Real Excel date/number cells are recommended. Use YYYY-MM-DD for text dates. Browser and Windows preferences may differ.</p><button onclick="downloadTemplate(this)">Download template</button></div><div class="card"><input id="workbookFile" type="file" accept=".xlsx"><p class="muted">Investments are appended. Reimporting the same workbook can create duplicate investments.</p><button onclick="importWorkbook(this)">Import workbook</button><div id="importMsg" class="notice" role="status"></div></div>`;}
function templateFields(kind){return kind==='equity'?[{key:'name',label:'Name',type:'text',required:true},{key:'symbol',label:'Symbol',type:'text',required:true},{key:'isin',label:'ISIN',type:'text'},{key:'type',label:'Type',type:'select',options:['Equity','ETF','Equity Mutual Fund','Debt Mutual Fund']},...SPECS.equity.fields.filter(f=>f.type!=='scrip')]:SPECS[kind].fields;}
async function downloadTemplate(b){b.disabled=true;try{const Excel=await excelLibrary(),wb=new Excel.Workbook(),instructions=wb.addWorksheet('Instructions');instructions.getColumn(1).width=110;['InvestTrack import template','Keep sheet names and headers unchanged. Input starts in row 2.','Blank rows are ignored. No example investments are included.','Use dropdowns for types and frequencies.','Use real Excel dates/numbers; text dates may use YYYY-MM-DD.','Policy numbers are text: preserve leading zeroes.','RD principal is monthly instalment. Debt calculations are estimates.','Import appends investments: do not import the same workbook twice.','Market price / NAV is read from saved market_prices, not from this workbook.'].forEach(t=>instructions.addRow([t]));const lists=wb.addWorksheet('Lists');let listCol=0;for(const [kind,spec]of Object.entries(SPECS)){const fields=templateFields(kind),sheet=wb.addWorksheet(spec.sheet,{views:[{state:'frozen',ySplit:1}]});sheet.columns=fields.map(f=>({header:f.label,key:f.key,width:Math.max(18,Math.min(34,f.label.length+3))}));sheet.getRow(1).height=36;sheet.getRow(1).eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF286449'}};c.alignment={wrapText:true,vertical:'middle'};});fields.forEach((f,col)=>{let letter;if(f.options){listCol++;letter=lists.getColumn(listCol).letter;f.options.forEach((o,i)=>lists.getCell(i+1,listCol).value=o);}for(let row=2;row<=501;row++){const cell=sheet.getCell(row,col+1);cell.numFmt=f.type==='date'?'[$-F800]dddd, mmmm dd, yyyy':f.type==='number'?'#,##0.00':'@';if(f.options)cell.dataValidation={type:'list',allowBlank:true,formulae:[`'Lists'!$${letter}$1:$${letter}$${f.options.length}`],showErrorMessage:true,errorTitle:'Choose a listed value',error:'Select from the dropdown.'};}});}lists.state='veryHidden';const url=URL.createObjectURL(new Blob([await wb.xlsx.writeBuffer()],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})),a=document.createElement('a');a.href=url;a.download='InvestTrack_Import_Template.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);status('importMsg','Template downloaded.');}catch(e){status('importMsg',e.message,true);}finally{b.disabled=false;}}
function cellValue(cell){const v=cell.value;if(v&&typeof v==='object'&&!(v instanceof Date)){if('formula'in v||'sharedFormula'in v)throw new Error('Use values, not formulas.');if(v.richText)return v.richText.map(x=>x.text).join('');if(v.text!=null)return v.text;}return v??'';}
async function importWorkbook(b){b.disabled=true;try{requireEditor();if(busy)throw new Error('Another operation is running.');const f=$('workbookFile').files[0];if(!f||!/\.xlsx$/i.test(f.name))throw new Error('Choose an .xlsx workbook.');setBusy(true);const Excel=await excelLibrary(),wb=new Excel.Workbook();await wb.xlsx.load(await f.arrayBuffer());if(!confirm('Import new records? Repeated imports can create duplicates.'))return;await loadMarketData(true);let saved=0,failed=0,recognised=0,errors=[];for(const [kind,spec]of Object.entries(SPECS)){const sheet=wb.getWorksheet(spec.sheet);if(!sheet)continue;recognised++;const headers={};sheet.getRow(1).eachCell((cell,col)=>headers[col]=normalise(cellValue(cell)));for(let row=2;row<=sheet.rowCount;row++){try{const source={};for(const [col,key]of Object.entries(headers))source[key]=cellValue(sheet.getCell(row,Number(col)));if(!Object.values(source).some(v=>v!==''&&v!=null))continue;const values={};spec.fields.forEach(f=>{if(f.type==='scrip')return;values[f.key]=source[normalise(f.label)]??source[normalise(f.key)]??'';if(f.options&&values[f.key]==='')values[f.key]=f.options[0];});if(kind==='equity'){const symbol=String(source.symbol||'').trim().toUpperCase(),name=String(source.name||'').trim();if(!symbol||!name)throw new Error('Name and Symbol required.');const i=await saveScrip({symbol,name,isin:String(source.isin||'').trim().toUpperCase(),type:source.type||'Equity'});values.instrument_id=i.id;}await saveInvestment(kind,values);saved++;}catch(e){failed++;if(errors.length<10)errors.push(spec.sheet+' row '+row+': '+e.message);}if(row%20===0)status('importMsg',`${saved} saved; ${failed} failed…`);}}if(!recognised)throw new Error('No recognised category sheets.');status('importMsg',`${saved} records added; ${failed} rows failed.\n${errors.join('\n')}`,failed>0);}catch(e){status('importMsg',e.message,true);}finally{setBusy(false);b.disabled=false;}}
async function usersScreen(version){try{if(!HOUSEHOLD)throw new Error('No household linked.');const users=await checked(client.from('household_members').select('user_id,email,role').eq('household_id',HOUSEHOLD).order('email'));if(version!==renderVersion)return;$('view').innerHTML='<h2>Household Users</h2><p class="muted">Household ID: '+esc(HOUSEHOLD)+'</p><p class="muted">Manage membership through Supabase Table Editor using Auth UUIDs. This screen does not load instruments or prices.</p><div class="card"><table><tr><th>Email</th><th>Role</th></tr>'+users.map(u=>'<tr><td>'+esc(u.email)+'</td><td>'+esc(u.role)+'</td></tr>').join('')+'</table>'+(!users.length?'<p>No visible members. Check membership SELECT policies.</p>':'')+'</div>';}catch(e){if(version!==renderVersion)return;$('view').innerHTML='<div class="card"><h2>Unable to load household users</h2><p class="error">'+esc(e.message)+'</p><p>Do not disable RLS. If the error mentions infinite recursion, membership policies need correction.</p><button onclick="render()">Retry</button></div>';console.error('Household users query:',e);}}
