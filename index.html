<<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InvestTrack — Family Investments</title>
<link rel="icon" href="data:,">

<style>
:root {
  color-scheme: light;
  --bg: #f5f2eb;
  --card: #fffdf8;
  --text: #233b2d;
  --muted: #637363;
  --line: #d7dfd0;
  --accent: #286449;
  --danger: #99463b;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.6 "Segoe UI", Arial, sans-serif;
}
button, input, select { font: inherit; }
button {
  padding: 10px 16px;
  background: var(--accent);
  color: white;
  border: 0;
  border-radius: 9px;
  cursor: pointer;
  font-weight: 600;
}
button:disabled { opacity: .5; cursor: wait; }
button.ghost { background: #e4ebdf; color: var(--text); }
button.danger { background: var(--danger); }
input, select {
  width: 100%;
  padding: 10px;
  border: 1px solid #bdcbb6;
  border-radius: 8px;
  background: #fcfdf9;
  color: var(--text);
}
label { display: block; margin: 12px 0 5px; }
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  padding: 18px 24px;
  background: #edf1e7;
  border-bottom: 1px solid var(--line);
}
.brand { font-size: 25px; font-weight: 750; }
.brand span { color: #38764d; }
nav {
  display: flex;
  gap: 8px;
  padding: 12px 24px;
  flex-wrap: wrap;
}
nav button { background: transparent; color: var(--muted); }
nav button.active { background: #dce8d4; color: #25472e; }
main { max-width: 1400px; margin: auto; padding: 24px; }
.card {
  padding: 24px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  margin-bottom: 20px;
  overflow: auto;
}
.row, .grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap: 16px;
}
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0; }
.muted, small { color: var(--muted); }
.notice { white-space: pre-wrap; overflow-wrap: anywhere; margin: 12px 0; }
.error { color: #a3352c; }
.hidden { display: none !important; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td {
  padding: 10px;
  text-align: left;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
th { white-space: nowrap; color: #496347; }
td .actions { margin: 0; flex-wrap: nowrap; }
.value { font-size: 28px; font-weight: 700; }
#global { margin: 0 24px; }
#login {
  width: min(560px,calc(100% - 32px));
  margin: 9vh auto;
  padding: 40px;
  border: 1px solid #c6d3bc;
  border-radius: 26px;
  background:
    radial-gradient(ellipse at top right,#e0ebd3,transparent 65%),
    #fffdf8;
  box-shadow: 0 24px 80px #25412515;
}
#login h1 { font-size: 36px; line-height: 1.2; letter-spacing: -1px; }
#signIn { width: 100%; min-height: 52px; }
.eyebrow { color: #91683f; text-transform: uppercase; letter-spacing: 2px; }
.modal {
  position: fixed;
  inset: 0;
  padding: 30px 16px;
  background: #152c22bb;
  overflow: auto;
  z-index: 50;
}
.modalbox { max-width: 950px; margin: auto; }
.suggest {
  max-height: 260px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 10px;
}
.suggest button {
  width: 100%;
  display: block;
  text-align: left;
  color: var(--text);
  background: #f4f8ee;
  border-radius: 0;
  border-bottom: 1px solid var(--line);
}
</style>
</head>

<body>
<section id="login">
  <div class="brand">↗ Invest<span>Track</span></div>
  <p class="eyebrow">Your family's financial picture</p>
  <h1>Every investment.<br>One clear view.</h1>
  <p class="muted">
    Equity, deposits, insurance and other assets,
    organised for your household.
  </p>
  <button id="signIn" type="button">Continue with Google</button>
  <div id="loginMsg" class="notice" role="status" aria-live="polite"></div>
  <small>Use the Google account approved for your household.</small>
</section>

<div id="app" class="hidden">
  <header>
    <div class="brand">↗ Invest<span>Track</span></div>
    <span id="who"></span>
    <button id="signOut" class="ghost">Sign out</button>
  </header>
  <nav id="nav"></nav>
  <div id="global" class="notice" role="status"></div>
  <main id="view"></main>
</div>

<div id="modal" class="modal hidden">
  <div class="card modalbox">
    <div id="modalBox"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
"use strict";

const SUPABASE_URL =
  "https://oqgtklevnwqnoafkzrcz.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_CsONgxTLUbhZca4uLVEyCw_XRyw53-b";

const $ = id => document.getElementById(id);

let client;
let USER = null;
let HOUSEHOLD = null;
let ROLE = "Viewer";
let currentTab = "dashboard";
let INSTRUMENTS = [];
let PRICES = {};
let recordCache = [];
let busy = false;

const locale = navigator.language || "en-IN";

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[character]));
}

function status(id, text, error = false) {
  const target = $(id) || $("global") || $("loginMsg");
  if (!target) {
    console[error ? "error" : "log"](text);
    return;
  }
  target.textContent = text;
  target.className = "notice" + (error ? " error" : "");
}

function today() {
  const date = new Date();
  return [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, "0"),
    String(date.getDate()).padStart(2, "0")
  ].join("-");
}

function money(value) {
  return new Intl.NumberFormat(locale, {
    style: "currency",
    currency: "INR",
    maximumFractionDigits: 2
  }).format(Number(value) || 0);
}

function dateText(value) {
  if (!value) return "";
  return new Intl.DateTimeFormat(locale).format(
    new Date(value + "T12:00:00")
  );
}

function canEdit() {
  return ["Owner", "Editor"].includes(ROLE);
}

function requireEditor() {
  if (!HOUSEHOLD || !canEdit()) {
    throw new Error("Owner or Editor access is required.");
  }
}

async function checked(query) {
  const result = await query;
  if (result.error) throw new Error(result.error.message);
  return result.data;
}

async function fetchAll(table) {
  const rows = [];
  let offset = 0;

  while (true) {
    const batch = await checked(
      client.from(table)
        .select("*")
        .eq("household_id", HOUSEHOLD)
        .order("id")
        .range(offset, offset + 499)
    );

    if (!batch || batch.length === 0) break;

    rows.push(...batch);
    offset += batch.length;
  }

  return rows;
}

async function loadMarketData() {
  const [instruments, prices] = await Promise.all([
    fetchAll("instruments"),
    fetchAll("market_prices")
  ]);

  INSTRUMENTS = instruments.sort((a, b) =>
    String(a.name || "").localeCompare(String(b.name || ""))
  );

  PRICES = Object.fromEntries(
    prices.map(row => [row.symbol, row])
  );
}

async function signInWithGoogle() {
  $("signIn").disabled = true;
  status("loginMsg", "Connecting to Google…");

  try {
    if (!client) throw new Error("Supabase library is unavailable.");

    const result = await client.auth.signInWithOAuth({
      provider: "google",
      options: {
        redirectTo: location.origin + location.pathname,
        skipBrowserRedirect: true
      }
    });

    if (result.error) throw result.error;
    if (!result.data?.url) throw new Error("No sign-in URL returned.");

    location.assign(result.data.url);
  } catch (error) {
    status("loginMsg", error.message, true);
    $("signIn").disabled = false;
  }
}

async function init() {
  try {
    if (!window.supabase) {
      throw new Error("Supabase library did not load.");
    }

    client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const sessionResult = await client.auth.getSession();
    if (sessionResult.error) throw sessionResult.error;
    if (!sessionResult.data.session) return;

    const userResult = await client.auth.getUser();
    if (userResult.error) throw userResult.error;

    USER = userResult.data.user;

    const memberships = await checked(
      client.from("household_members")
        .select("household_id,role")
        .eq("user_id", USER.id)
    );

    if (!memberships?.length) {
      await client.auth.signOut({ scope: "local" });
      throw new Error(
        "This account is not authorised. Ask the Owner to add your user ID."
      );
    }

    if (memberships.length !== 1) {
      throw new Error(
        "This version requires exactly one household membership per user."
      );
    }

    HOUSEHOLD = memberships[0].household_id;
    ROLE = memberships[0].role;

    $("who").textContent = USER.email + " · " + ROLE;
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");

    await render();
  } catch (error) {
    USER = null;
    HOUSEHOLD = null;
    $("app").classList.add("hidden");
    $("login").classList.remove("hidden");
    status("loginMsg", error.message, true);
  }
}

async function signOut() {
  if (busy) {
    status("global", "Wait for the current operation to finish.", true);
    return;
  }

  try {
    const result = await client.auth.signOut({ scope: "local" });
    if (result.error) throw result.error;

    USER = null;
    HOUSEHOLD = null;
    ROLE = "Viewer";
    INSTRUMENTS = [];
    PRICES = {};

    $("app").classList.add("hidden");
    $("login").classList.remove("hidden");
    $("signIn").disabled = false;

    status("loginMsg", "Signed out.");
  } catch (error) {
    status("global", error.message, true);
  }
}

const DEBT_TYPES = [
  "Fixed Deposit",
  "Recurring Deposit",
  "Bond",
  "Non-Convertible Debenture",
  "Sovereign Gold Bond",
  "Tax-free Bond",
  "Corporate FD",
  "Post Office Savings",
  "PPF",
  "Small Savings Scheme",
  "Debt Mutual Fund",
  "Other Debt Investment"
];

function field(key, label, type = "text", options = null, required = false) {
  return { key, label, type, options, required };
}

const SPECS = {
  equity: {
    title: "Equity & MF",
    table: "holdings",
    sheet: "Equity",
    fields: [
      field("instrument_id", "Scrip", "scrip", null, true),
      field("quantity", "Quantity", "number", null, true),
      field("avg_cost", "Average cost", "number", null, true),
      field("purchase_date", "Purchase date", "date", null, true),
      field("platform", "Platform")
    ]
  },
  debt: {
    title: "Debt & Maturity",
    table: "debt_investments",
    sheet: "Debt",
    fields: [
      field("investment_type", "Investment type", "select", DEBT_TYPES, true),
      field("name", "Name", "text", null, true),
      field("principal", "Principal or RD monthly instalment", "number", null, true),
      field("rate", "Annual rate (%)", "number", null, true),
      field("start_date", "Start date", "date", null, true),
      field("tenure_years", "Tenure years", "number"),
      field("tenure_months", "Tenure months", "number"),
      field("tenure_days", "Tenure days", "number"),
      field("interest_type", "Interest type", "select", [
        "Cumulative", "Fixed Payout", "Recurring Deposit"
      ]),
      field("payout", "Payout or compounding", "select", [
        "Monthly", "Quarterly", "Half-Yearly", "Annually", "Maturity"
      ]),
      field("ifsc", "Bank IFSC")
    ]
  },
  insurance: {
    title: "Insurance",
    table: "insurance_policies",
    sheet: "Insurance",
    fields: [
      field("insurer", "Insurer", "text", null, true),
      field("policy_name", "Policy name"),
      field("policy_type", "Policy type", "select", [
        "Term", "Endowment", "Money Back", "ULIP",
        "Whole Life", "Health", "Motor", "Other"
      ]),
      field("insured_name", "Insured person"),
      field("policy_number", "Policy number", "text", null, true),
      field("coverage_amount", "Coverage amount", "number", null, true),
      field("premium", "Premium", "number", null, true),
      field("premium_frequency", "Premium frequency", "select", [
        "Monthly", "Quarterly", "Half-Yearly", "Yearly", "Single"
      ]),
      field("start_date", "Start date", "date"),
      field("maturity_date", "Maturity date", "date"),
      field("nominee", "Nominee")
    ]
  },
  assets: {
    title: "Other Assets",
    table: "other_assets",
    sheet: "Other Assets",
    fields: [
      field("asset_type", "Asset type", "select", [
        "Jewellery", "Vehicle", "Real Estate", "Electronics",
        "Furniture", "Collectible", "Other"
      ]),
      field("name", "Name", "text", null, true),
      field("description", "Description"),
      field("purchase_date", "Purchase date", "date"),
      field("purchase_value", "Purchase value", "number"),
      field("current_value", "Current value", "number", null, true),
      field("location", "Location"),
      field("detail", "Extra detail")
    ]
  }
};

const TABS = [
  ["dashboard", "Dashboard"],
  ["equity", "Equity & MF"],
  ["debt", "Debt & Maturity"],
  ["insurance", "Insurance"],
  ["assets", "Other Assets"],
  ["market", "Market Data"],
  ["import", "Bulk Import"],
  ["users", "Users"]
];

async function render() {
  if (!HOUSEHOLD) return;

  $("nav").replaceChildren();

  TABS.forEach(([key, title]) => {
    const button = document.createElement("button");
    button.textContent = title;
    button.className = currentTab === key ? "active" : "";
    button.disabled = busy;

    button.onclick = () => {
      if (busy) return;
      currentTab = key;
      render();
    };

    $("nav").appendChild(button);
  });

  $("view").innerHTML = "<p>Loading…</p>";

  try {
    await loadMarketData();

    if (currentTab === "dashboard") await dashboard();
    else if (SPECS[currentTab]) await showRecords(currentTab);
    else if (currentTab === "market") marketScreen();
    else if (currentTab === "import") importScreen();
    else await usersScreen();
  } catch (error) {
    $("view").innerHTML =
      '<div class="card"><h2>Unable to load</h2><p>' +
      esc(error.message) +
      '</p><button onclick="render()">Retry</button></div>';
  }
}

function holdingValue(row) {
  const instrument = INSTRUMENTS.find(i => i.id === row.instrument_id);
  const price = Number(PRICES[instrument?.symbol]?.price);
  return Number(row.quantity) *
    (price > 0 ? price : Number(row.avg_cost));
}

async function dashboard() {
  const [holdings, debt, insurance, assets] = await Promise.all([
    fetchAll("holdings"),
    fetchAll("debt_investments"),
    fetchAll("insurance_policies"),
    fetchAll("other_assets")
  ]);

  const totals = {
    "Equity / fund valuation": holdings.reduce(
      (sum, row) => sum + holdingValue(row), 0
    ),
    "Active debt principal": debt.filter(r => r.status === "Active")
      .reduce((sum, row) => sum + Number(row.principal), 0),
    "Annualised insurance premiums": insurance.filter(r => r.status === "Active")
      .reduce((sum, row) => sum + Number(row.annualized_premium), 0),
    "Other asset valuation": assets.reduce(
      (sum, row) => sum + Number(row.current_value), 0
    )
  };

  $("view").innerHTML =
    '<h2>Household overview</h2><div class="grid">' +
    Object.entries(totals).map(([name, value]) =>
      '<div class="card"><h3>' + esc(name) +
      '</h3><div class="value">' + money(value) + "</div></div>"
    ).join("") +
    '</div><div class="card">' +
    INSTRUMENTS.length + " scrips and " +
    Object.keys(PRICES).length + " prices loaded." +
    '<p class="muted">Insurance premiums are not asset values. ' +
    "These cards should not be summed as net worth. " +
    "RD principal represents the monthly instalment in this version.</p></div>";
}

async function showRecords(kind) {
  const spec = SPECS[kind];
  recordCache = await fetchAll(spec.table);

  let columns = spec.fields
    .filter(f => f.type !== "scrip")
    .map(f => [f.key, f.label]);

  if (kind === "equity") {
    columns = [
      ["scrip", "Scrip"],
      ...columns,
      ["valuation", "Current value"],
      ["gain", "Gain / loss"]
    ];
  }

  if (kind === "debt") {
    columns.push(
      ["interest_amount", "Projected interest"],
      ["maturity_date", "Maturity date"],
      ["maturity_value", "Projected total receipts"]
    );
  }

  const rows = recordCache.map((record, index) => {
    const cells = columns.map(([key]) => {
      let value = record[key];

      if (key === "scrip") {
        const instrument = INSTRUMENTS.find(
          item => item.id === record.instrument_id
        );
        value = instrument
          ? instrument.symbol + " — " + instrument.name
          : "Unknown scrip";
      } else if (key === "valuation") {
        value = money(holdingValue(record));
      } else if (key === "gain") {
        value = money(
          holdingValue(record) - record.quantity * record.avg_cost
        );
      } else if (/date$/.test(key)) {
        value = dateText(value);
      } else if ([
        "avg_cost", "principal", "premium", "coverage_amount",
        "purchase_value", "current_value", "interest_amount", "maturity_value"
      ].includes(key)) {
        value = money(value);
      }

      return "<td>" + esc(value ?? "") + "</td>";
    }).join("");

    return "<tr>" + cells + "<td>" +
      (canEdit()
        ? '<div class="actions"><button onclick="recordForm(\'' +
          kind + "'," + index + ')">Edit</button>' +
          '<button class="danger" onclick="deleteRecord(\'' +
          kind + "'," + index + ')">Delete</button></div>'
        : "") +
      "</td></tr>";
  }).join("");

  $("view").innerHTML =
    "<h2>" + spec.title + "</h2>" +
    (canEdit()
      ? '<div class="actions"><button onclick="recordForm(\'' +
        kind + '\')">+ Add record</button></div>'
      : "") +
    '<div class="card"><table><tr>' +
    columns.map(c => "<th>" + esc(c[1]) + "</th>").join("") +
    "<th>Actions</th></tr>" + rows +
    "</table>" + (!recordCache.length ? "<p>No records.</p>" : "") +
    "</div>";
}

function closeModal() {
  $("modal").classList.add("hidden");
}

function recordForm(kind, index = null) {
  try {
    requireEditor();

    const spec = SPECS[kind];
    const original = index === null ? null : recordCache[index];

    if (index !== null && !original) {
      throw new Error("Record not found. Reload the page.");
    }

    $("modalBox").innerHTML =
      "<h2>" + (original ? "Edit " : "Add ") + spec.title + "</h2>" +
      '<form id="recordForm"><div class="row">' +
      spec.fields.map(f => {
        let control;

        if (f.type === "scrip") {
          control =
            '<input id="scripSearch" autocomplete="off" ' +
            'placeholder="Type 3 letters: name, symbol or ISIN">' +
            '<input id="f_instrument_id" type="hidden">' +
            '<div id="suggestions" class="suggest hidden"></div>' +
            '<small id="selection"></small>';
        } else if (f.type === "select") {
          control = '<select id="f_' + f.key + '">' +
            f.options.map(option =>
              "<option>" + esc(option) + "</option>"
            ).join("") + "</select>";
        } else {
          control =
            '<input id="f_' + f.key + '" type="' + f.type + '"' +
            (f.type === "number" ? ' step="any" min="0"' : "") +
            (f.required ? " required" : "") + ">";
        }

        return "<div><label>" + esc(f.label) +
          (f.required ? " *" : "") + "</label>" + control + "</div>";
      }).join("") +
      '</div><div class="actions"><button type="submit">Save changes</button>' +
      '<button type="button" class="ghost" onclick="closeModal()">Cancel</button>' +
      '</div><div id="formMsg" class="notice" role="status"></div></form>';

    spec.fields.forEach(f => {
      const input = $("f_" + f.key);
      const defaultValue = f.type === "select"
        ? f.options[0]
        : f.type === "date" && f.key !== "maturity_date"
          ? today()
          : "";

      input.value = original?.[f.key] ?? defaultValue;
    });

    if (kind === "equity") {
      const selected = INSTRUMENTS.find(
        i => i.id === original?.instrument_id
      );

      if (selected) {
        $("scripSearch").value = selected.symbol;
        $("selection").textContent = "Selected: " + selected.name;
      }

      $("scripSearch").oninput = () => {
        const query = $("scripSearch").value.trim().toLowerCase();
        const box = $("suggestions");

        $("f_instrument_id").value = "";
        $("selection").textContent = "";
        box.replaceChildren();
        box.classList.toggle("hidden", query.length < 3);

        if (query.length < 3) return;

        const matches = INSTRUMENTS.filter(item =>
          [item.name, item.symbol, item.isin].some(value =>
            String(value || "").toLowerCase().includes(query)
          )
        ).slice(0, 30);

        if (!matches.length) {
          box.textContent =
            "No match among " + INSTRUMENTS.length +
            " loaded scrips. Check the CSV import result.";
        }

        matches.forEach(item => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent =
            item.symbol + " — " + item.name + " · " + (item.isin || "");

          button.onclick = () => {
            $("f_instrument_id").value = item.id;
            $("scripSearch").value = item.symbol;
            $("selection").textContent = "Selected: " + item.name;
            box.classList.add("hidden");
          };

          box.appendChild(button);
        });
      };
    }

    $("recordForm").onsubmit = async event => {
      event.preventDefault();
      const button = event.submitter;
      button.disabled = true;

      try {
        const values = {};
        spec.fields.forEach(f => {
          values[f.key] = $("f_" + f.key).value;
        });

        await saveInvestment(kind, values, original?.id);
        closeModal();
        await render();
      } catch (error) {
        status("formMsg", error.message, true);
      } finally {
        button.disabled = false;
      }
    };

    $("modal").classList.remove("hidden");
  } catch (error) {
    status("global", error.message, true);
  }
}

function numberValue(value) {
  if (value === "" || value == null) return 0;
  if (typeof value === "number" && Number.isFinite(value)) return value;

  const parts = new Intl.NumberFormat(locale).formatToParts(12345.6);
  const group = parts.find(p => p.type === "group")?.value;
  const decimal = parts.find(p => p.type === "decimal")?.value || ".";

  let text = String(value).replace(/[₹\s]/g, "");
  if (group) text = text.split(group).join("");
  if (decimal !== ".") text = text.replace(decimal, ".");

  const number = Number(text);
  if (!Number.isFinite(number)) {
    throw new Error("Invalid number: " + value);
  }
  return number;
}

function isoDate(value) {
  if (value instanceof Date && !isNaN(value)) {
    return [
      value.getFullYear(),
      String(value.getMonth() + 1).padStart(2, "0"),
      String(value.getDate()).padStart(2, "0")
    ].join("-");
  }

  const text = String(value || "").trim();
  if (!text) return null;

  let year, month, day;

  if (/^\d{4}-\d{2}-\d{2}$/.test(text)) {
    [year, month, day] = text.split("-").map(Number);
  } else {
    const values = text.split(/[\/.-]/);
    const order = new Intl.DateTimeFormat(locale)
      .formatToParts(new Date(2020, 10, 22))
      .filter(p => ["year", "month", "day"].includes(p.type))
      .map(p => p.type);

    if (values.length !== 3) {
      throw new Error("Use an Excel date or YYYY-MM-DD.");
    }

    const mapped = {};
    order.forEach((key, i) => mapped[key] = Number(values[i]));
    year = mapped.year;
    month = mapped.month;
    day = mapped.day;
  }

  const date = new Date(year, month - 1, day);

  if (
    year < 1900 ||
    date.getFullYear() !== year ||
    date.getMonth() !== month - 1 ||
    date.getDate() !== day
  ) {
    throw new Error("Invalid date: " + text);
  }

  return year + "-" +
    String(month).padStart(2, "0") + "-" +
    String(day).padStart(2, "0");
}

function debtProjection(record) {
  const years =
    record.tenure_years +
    record.tenure_months / 12 +
    record.tenure_days / 365;

  if (years <= 0) throw new Error("Enter a positive debt tenure.");

  const principal = record.principal;
  const rate = record.rate / 100;
  let contributed = principal;
  let total;

  if (record.interest_type === "Recurring Deposit") {
    const months = Math.max(1, Math.round(years * 12));
    contributed = principal * months;
    total = 0;

    for (let month = 1; month <= months; month++) {
      total += principal * Math.pow(1 + rate / 12, month);
    }
  } else if (record.interest_type === "Cumulative") {
    const frequency = {
      Monthly: 12, Quarterly: 4,
      "Half-Yearly": 2, Annually: 1, Maturity: 1
    }[record.payout];

    total = principal * Math.pow(
      1 + rate / frequency, frequency * years
    );
  } else {
    total = principal + principal * rate * years;
  }

  const maturity = new Date(record.start_date + "T12:00:00");
  maturity.setFullYear(maturity.getFullYear() + record.tenure_years);
  maturity.setMonth(maturity.getMonth() + record.tenure_months);
  maturity.setDate(maturity.getDate() + record.tenure_days);

  const periods = {
    Monthly: 12, Quarterly: 4,
    "Half-Yearly": 2, Annually: 1
  }[record.payout] || 0;

  return {
    interest_amount: total - contributed,
    interest_per_year: (total - contributed) / years,
    interest_per_period: periods
      ? record.interest_type === "Fixed Payout"
        ? principal * rate / periods
        : (total - contributed) / (periods * years)
      : 0,
    maturity_date: isoDate(maturity),
    maturity_value: total
  };
}

async function saveInvestment(kind, input, id = null) {
  requireEditor();

  const spec = SPECS[kind];
  const record = {};

  for (const f of spec.fields) {
    let value = input[f.key] ?? "";

    if (f.required && (value === "" || value == null)) {
      throw new Error(f.label + " is required.");
    }

    if (f.type === "number") {
      value = numberValue(value);
      if (value < 0) throw new Error(f.label + " cannot be negative.");
    } else if (f.type === "date") {
      value = isoDate(value);
    } else {
      value = String(value).trim();
    }

    if (f.options && !f.options.includes(value)) {
      throw new Error("Choose a valid " + f.label + ".");
    }

    record[f.key] = value;
  }

  if (kind === "equity") {
    if (!INSTRUMENTS.some(i => i.id === record.instrument_id)) {
      throw new Error("Select a scrip from the search results.");
    }
    if (record.quantity <= 0) {
      throw new Error("Quantity must be positive.");
    }
  }

  if (kind === "debt") {
    if (record.principal <= 0) {
      throw new Error("Principal must be positive.");
    }

    ["tenure_years", "tenure_months", "tenure_days"].forEach(key => {
      if (!Number.isInteger(record[key])) {
        throw new Error("Tenure fields must be whole numbers.");
      }
    });

    Object.assign(record, debtProjection(record));
    if (!id) record.status = "Active";
  }

  if (kind === "insurance") {
    const multiplier = {
      Monthly: 12, Quarterly: 4,
      "Half-Yearly": 2, Yearly: 1, Single: 1
    }[record.premium_frequency];

    record.annualized_premium = record.premium * multiplier;
    if (!id) record.status = "Active";
  }

  if (id) {
    const changed = await checked(
      client.from(spec.table)
        .update(record)
        .eq("id", id)
        .eq("household_id", HOUSEHOLD)
        .select("id")
    );

    if (!changed?.length) {
      throw new Error(
        "No record was updated. Check the table's UPDATE security policy."
      );
    }
  } else {
    record.household_id = HOUSEHOLD;
    record.owner_email = USER.email;

    await checked(
      client.from(spec.table).insert(record)
    );
  }
}

async function deleteRecord(kind, index) {
  try {
    requireEditor();
    const record = recordCache[index];
    if (!record) throw new Error("Record not found.");
    if (!confirm("Delete this record?")) return;

    const changed = await checked(
      client.from(SPECS[kind].table)
        .delete()
        .eq("id", record.id)
        .eq("household_id", HOUSEHOLD)
        .select("id")
    );

    if (!changed?.length) {
      throw new Error("Deletion blocked by the database policy.");
    }

    await render();
  } catch (error) {
    status("global", error.message, true);
  }
}

const normalise = value =>
  String(value).toLowerCase().replace(/[^a-z0-9]/g, "");

function pick(row, ...names) {
  for (const name of names) {
    const key = Object.keys(row).find(k =>
      normalise(k) === normalise(name)
    );
    if (key !== undefined && row[key] !== "" && row[key] != null) {
      return row[key];
    }
  }
  return "";
}

function parseCSV(text) {
  text = text.replace(/^\uFEFF/, "");

  if (/^\s*</.test(text)) {
    throw new Error("This appears to be HTML, not a CSV file.");
  }

  let delimiter = ",";
  const first = text.split(/\r?\n/).find(line => line.trim()) || "";

  if (/^sep=./i.test(first)) {
    delimiter = first.slice(4, 5);
    text = text.slice(text.indexOf("\n") + 1);
  } else {
    delimiter = [",", ";", "\t"].sort(
      (a, b) => first.split(b).length - first.split(a).length
    )[0];
  }

  const rows = [];
  let row = [], value = "", quoted = false;

  for (let i = 0; i < text.length; i++) {
    const character = text[i];

    if (character === '"') {
      if (quoted && text[i + 1] === '"') {
        value += '"';
        i++;
      } else {
        quoted = !quoted;
      }
    } else if (character === delimiter && !quoted) {
      row.push(value.trim());
      value = "";
    } else if (/[\r\n]/.test(character) && !quoted) {
      if (character === "\r" && text[i + 1] === "\n") i++;
      row.push(value.trim());
      if (row.some(Boolean)) rows.push(row);
      row = [];
      value = "";
    } else {
      value += character;
    }
  }

  if (quoted) throw new Error("Unclosed quoted value in CSV.");

  row.push(value.trim());
  if (row.some(Boolean)) rows.push(row);

  if (rows.length < 2) throw new Error("No CSV data rows found.");

  const headers = rows.shift();

  return rows.map((values, index) => {
    if (values.length > headers.length) {
      throw new Error("Too many columns in CSV row " + (index + 2));
    }
    return Object.fromEntries(
      headers.map((header, i) => [header, values[i] || ""])
    );
  });
}

async function saveScrip(data) {
  requireEditor();

  const existing = INSTRUMENTS.find(i => i.symbol === data.symbol);

  if (existing) {
    const update = {};
    ["name", "isin", "type"].forEach(key => {
      if (data[key]) update[key] = data[key];
    });

    if (!Object.keys(update).length) return existing;

    const rows = await checked(
      client.from("instruments")
        .update(update)
        .eq("id", existing.id)
        .eq("household_id", HOUSEHOLD)
        .select("*")
    );

    if (!rows?.length) {
      throw new Error("Scrip update blocked by database policy.");
    }

    Object.assign(existing, rows[0]);
    return existing;
  }

  const inserted = await checked(
    client.from("instruments").insert({
      household_id: HOUSEHOLD,
      type: data.type || "Equity",
      symbol: data.symbol,
      name: data.name || data.symbol,
      isin: data.isin || "",
      exchange: "NSE",
      issuer: data.name || data.symbol,
      category: "Imported"
    }).select().single()
  );

  INSTRUMENTS.push(inserted);
  return inserted;
}

async function importCSV(mode, button) {
  const messageId = mode === "master" ? "masterMsg" : "priceMsg";

  try {
    requireEditor();
    if (busy) throw new Error("Another operation is running.");

    const file = $(mode === "master" ? "masterFile" : "priceFile").files[0];
    if (!file || !/\.csv$/i.test(file.name)) {
      throw new Error("Choose an extracted .csv file.");
    }

    busy = true;
    button.disabled = true;

    const rows = parseCSV(await file.text());
    const priceField = mode === "prices" ? $("csvPriceField").value : null;

    if (!Object.keys(rows[0]).some(key =>
      ["symbol", "tckrsymb", "tradingsymbol"].includes(normalise(key))
    )) {
      throw new Error("SYMBOL or TckrSymb header not found.");
    }

    let saved = 0, skipped = 0, failed = 0;
    const errors = [];

    for (let index = 0; index < rows.length; index++) {
      const row = rows[index];

      try {
        const symbol = String(
          pick(row, "SYMBOL", "TckrSymb", "TRADING SYMBOL")
        ).trim().toUpperCase();

        const series = String(
          pick(row, "SERIES", "SctySrs")
        ).trim().toUpperCase();

        if (!symbol || (
          mode === "prices" && series && !["EQ", "BE"].includes(series)
        )) {
          skipped++;
          continue;
        }

        const name = String(pick(
          row, "NAME OF COMPANY", "COMPANY NAME",
          "SECURITY NAME", "FinInstrmNm", "NAME"
        )).trim();

        const isin = String(pick(
          row, "ISIN", "ISIN NUMBER", "ISIN CODE"
        )).trim().toUpperCase();

        if (mode === "master") {
          await saveScrip({ symbol, name, isin });
        } else {
          const raw = priceField === "previous"
            ? pick(row, "PREVCLOSE", "PREV CLOSE", "PREVIOUS CLOSE", "PrvsClsgPric")
            : pick(row, "CLOSE", "CLOSE PRICE", "ClsPric");

          const price = Number(String(raw).replace(/,/g, ""));

          if (raw === "" || !Number.isFinite(price) || price <= 0) {
            throw new Error("Selected price field is missing or invalid.");
          }

          await saveScrip({ symbol, name, isin });

          const savedPrice = await checked(
            client.from("market_prices").upsert({
              household_id: HOUSEHOLD,
              symbol,
              price,
              source: "NSE " + priceField + " · " + file.name,
              fetched_at: new Date().toISOString()
            }, { onConflict: "household_id,symbol" })
              .select().single()
          );

          PRICES[symbol] = savedPrice;
        }

        saved++;
      } catch (error) {
        failed++;
        if (errors.length < 8) {
          errors.push("Row " + (index + 2) + ": " + error.message);
        }

        if (/recursion|permission|row.level|schema cache/i.test(error.message)) {
          errors.push("Stopped early. Correct database policies before retrying.");
          break;
        }
      }

      if (index % 20 === 0) {
        status(messageId,
          `${index + 1}/${rows.length}: ${saved} saved; ${failed} failed…`
        );
        await new Promise(resolve => setTimeout(resolve, 0));
      }
    }

    status(messageId,
      `${saved} saved; ${skipped} skipped; ${failed} failed.\n` +
      errors.join("\n"),
      failed > 0
    );
  } catch (error) {
    status(messageId, error.message, true);
  } finally {
    busy = false;
    button.disabled = false;
  }
}

let excelPromise;

async function excelLibrary() {
  if (window.ExcelJS) return window.ExcelJS;

  if (!excelPromise) {
    excelPromise = new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src =
        "https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js";
      script.onload = () => resolve(window.ExcelJS);
      script.onerror = () => {
        excelPromise = null;
        reject(new Error("Excel library could not load."));
      };
      document.head.appendChild(script);
    });
  }

  return excelPromise;
}

async function downloadTemplate(button) {
  button.disabled = true;

  try {
    const Excel = await excelLibrary();
    const workbook = new Excel.Workbook();
    const instructions = workbook.addWorksheet("Instructions");
    instructions.getColumn(1).width = 110;

    [
      "InvestTrack import template",
      "Keep sheet names and headers unchanged. Enter data from row 2.",
      "Blank rows are ignored. No example investments are included.",
      "Use dropdowns for types and frequencies.",
      "Use real Excel dates/numbers; text dates may use YYYY-MM-DD.",
      "Policy numbers are text: preserve leading zeroes.",
      "RD principal means monthly instalment.",
      "Debt calculations are estimates, not product-specific guarantees.",
      "Import appends investments. Do not import the same workbook twice."
    ].forEach(text => instructions.addRow([text]));

    const lists = workbook.addWorksheet("Lists");
    let listColumn = 0;

    for (const [kind, spec] of Object.entries(SPECS)) {
      const fields = templateFields(kind);
      const sheet = workbook.addWorksheet(spec.sheet, {
        views: [{ state: "frozen", ySplit: 1 }]
      });

      sheet.columns = fields.map(f => ({
        header: f.label,
        key: f.key,
        width: Math.max(18, Math.min(34, f.label.length + 3))
      }));

      sheet.getRow(1).height = 36;
      sheet.getRow(1).eachCell(cell => {
        cell.font = { bold: true, color: { argb: "FFFFFFFF" } };
        cell.fill = {
          type: "pattern", pattern: "solid",
          fgColor: { argb: "FF286449" }
        };
        cell.alignment = { wrapText: true, vertical: "middle" };
      });

      fields.forEach((f, columnIndex) => {
        let letter;

        if (f.options) {
          listColumn++;
          letter = lists.getColumn(listColumn).letter;
          f.options.forEach((option, i) => {
            lists.getCell(i + 1, listColumn).value = option;
          });
        }

        for (let row = 2; row <= 501; row++) {
          const cell = sheet.getCell(row, columnIndex + 1);

          cell.numFmt = f.type === "date"
            ? "[$-F800]dddd, mmmm dd, yyyy"
            : f.type === "number"
              ? "#,##0.00"
              : "@";

          if (f.options) {
            cell.dataValidation = {
              type: "list",
              allowBlank: true,
              formulae: [
                `'Lists'!$${letter}$1:$${letter}$${f.options.length}`
              ],
              showErrorMessage: true,
              errorTitle: "Choose a listed value",
              error: "Select a value from the dropdown."
            };
          }
        }
      });
    }

    lists.state = "veryHidden";

    const buffer = await workbook.xlsx.writeBuffer();
    const url = URL.createObjectURL(new Blob([buffer], {
      type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    }));

    const link = document.createElement("a");
    link.href = url;
    link.download = "InvestTrack_Import_Template.xlsx";
    link.click();

    setTimeout(() => URL.revokeObjectURL(url), 60000);
    status("importMsg", "Template downloaded.");
  } catch (error) {
    status("importMsg", error.message, true);
  } finally {
    button.disabled = false;
  }
}

function cellValue(cell) {
  const value = cell.value;

  if (value && typeof value === "object" && !(value instanceof Date)) {
    if ("formula" in value || "sharedFormula" in value) {
      throw new Error("Use values rather than formulas in import cells.");
    }
    if (value.richText) return value.richText.map(item => item.text).join("");
    if (value.text != null) return value.text;
  }

  return value ?? "";
}

async function importWorkbook(button) {
  button.disabled = true;

  try {
    requireEditor();
    if (busy) throw new Error("Another operation is running.");

    const file = $("workbookFile").files[0];
    if (!file || !/\.xlsx$/i.test(file.name)) {
      throw new Error("Choose an .xlsx workbook.");
    }

    const Excel = await excelLibrary();
    const workbook = new Excel.Workbook();
    await workbook.xlsx.load(await file.arrayBuffer());

    if (!confirm("Import new records? Repeated imports can create duplicates.")) {
      return;
    }

    busy = true;
    await loadMarketData();

    let saved = 0, failed = 0, recognised = 0;
    const errors = [];

    for (const [kind, spec] of Object.entries(SPECS)) {
      const sheet = workbook.getWorksheet(spec.sheet);
      if (!sheet) continue;
      recognised++;

      const headers = {};
      sheet.getRow(1).eachCell((cell, column) => {
        headers[column] = normalise(cellValue(cell));
      });

      for (let rowIndex = 2; rowIndex <= sheet.rowCount; rowIndex++) {
        try {
          const source = {};

          for (const [column, header] of Object.entries(headers)) {
            source[header] = cellValue(
              sheet.getCell(rowIndex, Number(column))
            );
          }

          if (!Object.values(source).some(v => v !== "" && v != null)) continue;

          const values = {};

          spec.fields.forEach(f => {
            if (f.type === "scrip") return;
            values[f.key] =
              source[normalise(f.label)] ??
              source[normalise(f.key)] ??
              "";

            if (f.options && values[f.key] === "") {
              values[f.key] = f.options[0];
            }
          });

          if (kind === "equity") {
            const symbol = String(source.symbol || "").trim().toUpperCase();
            const name = String(source.name || "").trim();

            if (!symbol || !name) {
              throw new Error("Name and Symbol are required.");
            }

            const instrument = await saveScrip({
              symbol,
              name,
              isin: String(source.isin || "").trim().toUpperCase(),
              type: source.type || "Equity"
            });

            values.instrument_id = instrument.id;
          }

          await saveInvestment(kind, values);
          saved++;
        } catch (error) {
          failed++;
          if (errors.length < 10) {
            errors.push(
              spec.sheet + " row " + rowIndex + ": " + error.message
            );
          }
        }

        if (rowIndex % 20 === 0) {
          status("importMsg", `${saved} saved; ${failed} failed…`);
        }
      }
    }

    if (!recognised) {
      throw new Error("No recognised category sheets found.");
    }

    status("importMsg",
      `${saved} records added; ${failed} rows failed.\n` + errors.join("\n"),
      failed > 0
    );
  } catch (error) {
    status("importMsg", error.message, true);
  } finally {
    busy = false;
    button.disabled = false;
  }
}

async function usersScreen() {
  const users = await fetchAll("household_members");

  $("view").innerHTML =
    "<h2>Household Users</h2>" +
    '<p class="muted">Membership is managed in Supabase Table Editor. ' +
    "Household ID: " + esc(HOUSEHOLD) + "</p>" +
    '<div class="card"><table><tr><th>Email</th><th>Role</th></tr>' +
    users.map(user =>
      "<tr><td>" + esc(user.email) + "</td><td>" +
      esc(user.role) + "</td></tr>"
    ).join("") +
    "</table></div>";
}

$("signIn").addEventListener("click", signInWithGoogle);
$("signOut").addEventListener("click", signOut);

$("modal").addEventListener("click", event => {
  if (event.target.id === "modal") closeModal();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeModal();
});

window.addEventListener("unhandledrejection", event => {
  status(
    $("app").classList.contains("hidden") ? "loginMsg" : "global",
    event.reason?.message || String(event.reason),
    true
  );
});

init();
</script>
